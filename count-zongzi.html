<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数粽子挑战</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">🍙</span><span>数粽子挑战</span></div><nav class="nav"><a class="btn alt" href="../index.html">首页</a><a class="btn alt" href="../leaderboard.html">排行榜</a></nav></header><section class="card panel center"><div class="row" style="justify-content:center"><div>时间：<b id="time">30</b>s</div><div>得分：<b id="score">0</b></div></div><p class="muted">点击出现的粽子，30 秒内得分越高越好。</p><div class="zongzi-area" id="area"></div><div class="row" style="justify-content:center;margin-top:18px"><input class="input" id="name" placeholder="输入昵称保存成绩" style="max-width:240px"><button class="btn" id="start">开始</button><button class="btn alt" id="save" disabled>保存成绩</button></div></section></div><script src="../store.js"></script><script>let score=0,left=30,timer=null,spawn=null;const area=document.getElementById('area');function addZ(){const b=document.createElement('button');b.className='zongzi';b.textContent=Math.random()>.15?'🍙':'🐉';b.style.left=Math.random()*85+'%';b.style.top=Math.random()*80+'%';b.onclick=()=>{score+=b.textContent==='🐉'?5:1;document.getElementById('score').textContent=score;b.remove()};area.appendChild(b);setTimeout(()=>b.remove(),1100)}start.onclick=()=>{score=0;left=30;area.innerHTML='';save.disabled=true;document.getElementById('score').textContent=0;document.getElementById('time').textContent=left;clearInterval(timer);clearInterval(spawn);spawn=setInterval(addZ,520);timer=setInterval(()=>{left--;time.textContent=left;if(left<=0){clearInterval(timer);clearInterval(spawn);save.disabled=false;area.innerHTML='<h2 style="margin-top:160px">游戏结束！得分 '+score+'</h2>'}},1000)};save.onclick=()=>{saveScore('数粽子挑战',name.value,score);location.href='../leaderboard.html'}</script></body></html>
