<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记忆翻牌</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">🧠</span><span>记忆翻牌</span></div><nav class="nav"><a class="btn alt" href="../index.html">首页</a><a class="btn alt" href="../leaderboard.html">排行榜</a></nav></header><section class="card panel center"><div class="row" style="justify-content:center"><div>步数：<b id="moves">0</b></div><div>配对：<b id="pairs">0</b>/8</div><div>得分：<b id="score">0</b></div></div><div class="board" id="board" style="grid-template-columns:repeat(4,1fr)"></div><div class="row" style="justify-content:center"><input class="input" id="name" placeholder="输入昵称保存成绩" style="max-width:240px"><button class="btn" id="reset">重新开始</button><button class="btn alt" id="save" disabled>保存成绩</button></div></section></div><script src="../store.js"></script><script>const icons='🥟🐲🛶🌿🍵🥁🌊✨'.split('');let deck=[],open=[],matched=0,mv=0,sc=0;function init(){deck=[...icons,...icons].sort(()=>Math.random()-.5);open=[];matched=0;mv=0;sc=0;save.disabled=true;draw()}function draw(){moves.textContent=mv;pairs.textContent=matched;score.textContent=sc;board.innerHTML=deck.map((v,i)=>`<button class="tile ${open.includes(i)||v==='_'?'':'hidden'}" data-i="${i}">${v==='_'?'':v}</button>`).join('');document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>flip(+t.dataset.i))}function flip(i){if(deck[i]==='_'||open.includes(i)||open.length===2)return;open.push(i);if(open.length===2){mv++;const[a,b]=open;if(deck[a]===deck[b]){matched++;sc+=Math.max(5,30-mv);setTimeout(()=>{deck[a]=deck[b]='_';open=[];if(matched===8)save.disabled=false;draw()},350)}else setTimeout(()=>{open=[];draw()},650)}draw()}reset.onclick=init;save.onclick=()=>{saveScore('记忆翻牌',name.value,sc);location.href='../leaderboard.html'};init()</script></body></html>
