<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>排行榜</title><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">榜</span><span>排行榜</span></div><nav class="nav"><a class="btn alt" href="index.html">首页</a><button class="btn" id="clear">清空本地榜单</button></nav></header><section class="card panel"><p class="muted">数据保存在当前浏览器 localStorage 中，部署到 GitHub Pages 后无需后端即可演示。</p><table><thead><tr><th>排名</th><th>玩家</th><th>游戏</th><th>分数</th><th>时间</th></tr></thead><tbody id="body"></tbody></table></section></div><script src="store.js"></script><script>function render(){const rows=getScores();body.innerHTML=rows.length?rows.map((s,i)=>`<tr><td>#${i+1}</td><td>${s.name}</td><td>${s.game}</td><td><b>${s.score}</b></td><td>${s.time}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">暂无成绩，先去玩一局吧。</td></tr>'}clear.onclick=()=>{clearScores();render()};render()</script></body></html>
