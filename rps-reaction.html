<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反应猜拳</title><link rel="stylesheet" href="../style.css"></head><body><div class="wrap"><header class="top"><div class="brand"><span class="logo">✊</span><span>反应猜拳</span></div><nav class="nav"><a class="btn alt" href="../index.html">首页</a><a class="btn alt" href="../leaderboard.html">排行榜</a></nav></header><section class="card panel center"><p class="muted">系统出拳后，请选择能赢它的手势。连续答对加分！</p><div class="score" id="target">?</div><div>得分：<b id="score">0</b>　连击：<b id="combo">0</b>　剩余：<b id="left">15</b></div><div class="choices"><button class="choice" data-v="rock">✊</button><button class="choice" data-v="paper">✋</button><button class="choice" data-v="scissors">✌️</button></div><p id="msg" class="muted">点击开始</p><div class="row" style="justify-content:center"><input class="input" id="name" placeholder="输入昵称保存成绩" style="max-width:240px"><button class="btn" id="start">开始</button><button class="btn alt" id="save" disabled>保存成绩</button></div></section></div><script src="../store.js"></script><script>const map={rock:'✊',paper:'✋',scissors:'✌️'},win={rock:'paper',paper:'scissors',scissors:'rock'};let cur='rock',sc=0,cb=0,rounds=15,playing=false;function next(){cur=Object.keys(map)[Math.floor(Math.random()*3)];target.textContent=map[cur];left.textContent=rounds}function end(){playing=false;msg.textContent='结束！最终得分 '+sc;save.disabled=false}start.onclick=()=>{sc=0;cb=0;rounds=15;playing=true;save.disabled=true;score.textContent=0;combo.textContent=0;msg.textContent='选择能赢它的手势';next()};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(!playing)return;if(b.dataset.v===win[cur]){cb++;sc+=10+cb*2;msg.textContent='正确！+'+(10+cb*2)}else{cb=0;sc=Math.max(0,sc-4);msg.textContent='错啦，连击清零'}rounds--;score.textContent=sc;combo.textContent=cb;if(rounds<=0)end();else next()});save.onclick=()=>{saveScore('反应猜拳',name.value,sc);location.href='../leaderboard.html'}</script></body></html>
